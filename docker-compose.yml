# Two containers, one privacy boundary.
#
#   evaluator  — has fixture.json, task.json, policy.md, and rebook/grader.
#                Not published to the host (no `ports:`), only reachable by
#                the agent service over the internal `rb01` network.
#   agent      — has only docker/agent_client.py. No fixture, no task, no
#                grader on this image at all; it can only act through the
#                evaluator's HTTP API.
#
# Run: docker compose up --build
# The agent container plays the reference booking and exits; watch its
# logs to see the round trip, then check evaluator logs (empty stdout by
# design — see rebook/server.py's log_message override) to confirm no
# grading secret was ever printed or returned.
services:
  evaluator:
    build:
      context: .
      dockerfile: docker/Dockerfile.evaluator
    networks: [rb01]
    expose: ["8000"]  # internal only; intentionally no `ports:` mapping

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    networks: [rb01]
    depends_on: [evaluator]
    # No `volumes:` — the agent container cannot mount the repo, the
    # fixture, or the grader. Its filesystem is exactly what was COPYed
    # into Dockerfile.agent: one file.

networks:
  rb01:
    driver: bridge
